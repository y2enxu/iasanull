<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    >

    <title>게시글 수정 - IASA 게시판</title>


    <style>

        /* ==================================================
           기본 설정
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard", sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #20252b;
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }


        /* ==================================================
           헤더
        ================================================== */

        header {
            height: 68px;

            display: flex;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #579fe0,
                    #67b2e8
                );

            color: white;

            box-shadow:
                0 2px 10px rgba(48, 102, 150, 0.15);
        }

        header h1 a {
            color: white;
            text-decoration: none;
        }

        .header-inner {
            width: 92%;
            max-width: 1100px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 23px;
            font-weight: 750;
            letter-spacing: -0.7px;
        }

        .header-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }


        /* ==================================================
           전체 컨테이너
        ================================================== */

        .container {
            width: 92%;
            max-width: 900px;

            margin: 32px auto 50px;
        }


        /* ==================================================
           페이지 상단
        ================================================== */

        .page-header {
            margin-bottom: 16px;
        }

        .page-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            color: #4d99d5;
            font-size: 12px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        .page-label::before {
            content: "";
            width: 6px;
            height: 6px;

            border-radius: 50%;
            background: #5fa8e8;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 750;
            letter-spacing: -0.7px;
            color: #252a30;
        }

        .page-header p {
            margin-top: 6px;

            color: #8a929c;
            font-size: 13px;
            line-height: 1.5;
        }


        /* ==================================================
           수정 박스
        ================================================== */

        .edit-box {
            background: white;

            border: 1px solid #e5e9ee;
            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 4px 18px rgba(38, 67, 92, 0.06);
        }


        /* ==================================================
           입력 영역
        ================================================== */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: flex;
            align-items: center;

            margin-bottom: 8px;

            color: #39414a;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        label::after {
            content: "*";

            margin-left: 4px;

            color: #5fa8e8;
            font-size: 12px;
        }


        /* ==================================================
           입력창 공통
        ================================================== */

        input,
        select,
        textarea {
            width: 100%;

            border: 1px solid #dfe4e9;
            border-radius: 8px;

            background: #fcfdff;

            color: #252a30;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        input,
        select {
            height: 46px;
            padding: 0 13px;
        }

        textarea {
            min-height: 350px;

            padding: 13px;

            resize: vertical;

            line-height: 1.75;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aeb5bd;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: #c9d5df;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #5fa8e8;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(95, 168, 232, 0.11);
        }

        select {
            cursor: pointer;
            appearance: auto;
        }


        /* ==================================================
           하단 구분선
        ================================================== */

        .form-divider {
            height: 1px;

            background: #edf0f3;

            margin: 28px 0 20px;
        }


        /* ==================================================
           하단 버튼
        ================================================== */

        .buttons {
            display: flex;
            justify-content: flex-end;
            align-items: center;

            gap: 8px;
        }

        .buttons button {
            height: 42px;

            padding: 0 19px;

            border-radius: 7px;

            font-size: 13px;
            font-weight: 600;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.1s;
        }

        .buttons button:active {
            transform: translateY(1px);
        }


        /* 취소 */

        .cancel-button {
            border: 1px solid #dfe3e7;

            background: white;
            color: #707780;
        }

        .cancel-button:hover {
            background: #f7f8fa;
            border-color: #d3d8de;
        }


        /* 저장 */

        .save-button {
            border: 1px solid #5fa8e8;

            background:
                linear-gradient(
                    135deg,
                    #5fa8e8,
                    #69b0e6
                );

            color: white;

            box-shadow:
                0 3px 8px rgba(76, 147, 205, 0.18);
        }

        .save-button:hover {
            background:
                linear-gradient(
                    135deg,
                    #4f99da,
                    #5da7df
                );

            box-shadow:
                0 4px 11px rgba(76, 147, 205, 0.25);
        }


        /* 비활성화 */

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }


        /* ==================================================
           모바일
        ================================================== */

        @media (max-width: 600px) {

            body {
                overflow-x: hidden;
            }


            /* 헤더 */

            header {
                height: 58px;
            }

            .header-inner {
                width: 94%;
            }

            header h1 {
                font-size: 19px;
            }

            .header-subtitle {
                display: none;
            }


            /* 컨테이너 */

            .container {
                width: 94%;

                margin: 20px auto 35px;
            }


            /* 페이지 제목 */

            .page-header {
                margin-bottom: 13px;
            }

            .page-label {
                font-size: 11px;
                margin-bottom: 5px;
            }

            .page-header h2 {
                font-size: 21px;
            }

            .page-header p {
                font-size: 12px;
                margin-top: 5px;
            }


            /* 수정 박스 */

            .edit-box {
                padding: 18px;

                border-radius: 10px;
            }


            /* 입력 영역 */

            .form-group {
                margin-bottom: 19px;
            }

            label {
                font-size: 13px;
                margin-bottom: 7px;
            }

            input,
            select {
                height: 44px;

                padding: 0 11px;

                font-size: 14px;
            }

            textarea {
                min-height: 280px;

                padding: 11px;

                font-size: 14px;
                line-height: 1.7;
            }


            /* 구분선 */

            .form-divider {
                margin: 23px 0 16px;
            }


            /* 버튼 */

            .buttons {
                flex-direction: column-reverse;

                gap: 7px;
            }

            .buttons button {
                width: 100%;

                height: 44px;

                font-size: 13px;
            }

        }


        /* ==================================================
           매우 작은 화면
        ================================================== */

        @media (max-width: 380px) {

            .container {
                width: 94%;
            }

            .edit-box {
                padding: 15px;
            }

            .page-header h2 {
                font-size: 20px;
            }

            textarea {
                min-height: 260px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         헤더
    ================================================== -->

    <header>

        <div class="header-inner">

            <h1>
                <a href="/">IASA 게시판</a>
            </h1>

            <span class="header-subtitle">
                COMMUNITY
            </span>

        </div>

    </header>


    <!-- ==================================================
         메인
    ================================================== -->

    <main class="container">


        <!-- 페이지 제목 -->

        <div class="page-header">

            <div class="page-label">
                POST
            </div>

            <h2>
                게시글 수정
            </h2>

            <p>
                게시글의 내용을 수정할 수 있습니다.
            </p>

        </div>


        <!-- ==================================================
             수정 폼
        ================================================== -->

        <section class="edit-box">


            <!-- 제목 -->

            <div class="form-group">

                <label for="title">
                    제목
                </label>

                <input
                    type="text"
                    id="title"
                    maxlength="200"
                    placeholder="제목을 입력하세요."
                >

            </div>


            <!-- 분류 -->

            <div class="form-group">

                <label for="category">
                    분류
                </label>

                <select id="category">

                    <option value="일반">
                        일반
                    </option>

                    <option value="학업·질문">
                        학업·질문
                    </option>

                    <option value="시설·건의사항">
                        시설·건의사항
                    </option>

                </select>

            </div>


            <!-- 내용 -->

            <div class="form-group">

                <label for="content">
                    내용
                </label>

                <textarea
                    id="content"
                    placeholder="내용을 입력하세요."
                ></textarea>

            </div>


            <!-- 구분선 -->

            <div class="form-divider"></div>


            <!-- 버튼 -->

            <div class="buttons">

                <button
                    type="button"
                    class="cancel-button"
                    onclick="cancelEdit()"
                >
                    취소
                </button>

                <button
                    type="button"
                    id="saveButton"
                    class="save-button"
                    onclick="savePost()"
                >
                    수정 완료
                </button>

            </div>

        </section>

    </main>


    <!-- ==================================================
         JavaScript
    ================================================== -->

    <script>

        /* ==================================================
           전역 변수
        ================================================== */

        const params =
            new URLSearchParams(location.search);

        const id =
            params.get("id");


        /* ==================================================
           게시글 불러오기
        ================================================== */

        async function loadPost() {

            // 게시글 번호 확인

            if (!id) {

                alert(
                    "게시글 번호가 없습니다."
                );

                history.back();

                return;

            }


            try {

                /* 게시글 요청 */

                const response =
                    await fetch(
                        `/api/posts/${id}`
                    );

                const post =
                    await response.json();


                /* 게시글 존재 여부 */

                if (!response.ok) {

                    alert(
                        post.message ||
                        "게시글을 불러올 수 없습니다."
                    );

                    history.back();

                    return;

                }


                /* 현재 로그인 사용자 확인 */

                const meResponse =
                    await fetch("/api/me");

                const me =
                    await meResponse.json();


                /* 로그인 여부 */

                if (!me.loggedIn) {

                    alert(
                        "로그인이 필요합니다."
                    );

                    location.href =
                        "/login.html";

                    return;

                }


                /* 작성자 본인 여부 */

                if (
                    Number(me.userId) !==
                    Number(post.author_id)
                ) {

                    alert(
                        "이 게시글을 수정할 권한이 없습니다."
                    );

                    history.back();

                    return;

                }


                /* 폼에 기존 내용 입력 */

                document.getElementById(
                    "title"
                ).value = post.title;


                document.getElementById(
                    "content"
                ).value = post.content;


                document.getElementById(
                    "category"
                ).value =
                    post.category || "일반";

            }

            catch (error) {

                console.error(
                    "게시글 불러오기 오류:",
                    error
                );

                alert(
                    "게시글을 불러오는 중 오류가 발생했습니다."
                );

            }

        }


        /* ==================================================
           게시글 수정
        ================================================== */

        async function savePost() {

            /* 입력값 가져오기 */

            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();

            const content =
                document
                    .getElementById("content")
                    .value
                    .trim();

            const category =
                document
                    .getElementById("category")
                    .value;


            /* 입력값 검사 */

            if (!title) {

                alert(
                    "제목을 입력하세요."
                );

                document
                    .getElementById("title")
                    .focus();

                return;

            }


            if (!content) {

                alert(
                    "내용을 입력하세요."
                );

                document
                    .getElementById("content")
                    .focus();

                return;

            }


            /* 저장 버튼 비활성화 */

            const saveButton =
                document.getElementById(
                    "saveButton"
                );

            saveButton.disabled = true;

            saveButton.textContent =
                "수정 중...";


            try {

                /* 서버에 수정 요청 */

                const response =
                    await fetch(
                        `/api/posts/${id}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                title: title,
                                content: content,
                                category: category
                            })
                        }
                    );


                const result =
                    await response.json();


                /* 수정 실패 */

                if (!response.ok) {

                    alert(
                        result.message ||
                        "게시글 수정에 실패했습니다."
                    );

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "수정 완료";

                    return;

                }


                /* 수정 성공 */

                alert(
                    "게시글이 수정되었습니다."
                );

                location.href =
                    `/post.html?id=${id}`;

            }

            catch (error) {

                console.error(
                    "게시글 수정 오류:",
                    error
                );

                alert(
                    "게시글 수정 중 오류가 발생했습니다."
                );

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "수정 완료";

            }

        }


        /* ==================================================
           수정 취소
        ================================================== */

        function cancelEdit() {

            history.back();

        }


        /* ==================================================
           페이지 초기화
        ================================================== */

        loadPost();

    </script>

</body>

</html>
