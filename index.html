<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<title>IASA 게시판</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard",sans-serif;
}

body{
    background:#f5f7fb;
}

header{
    background:#5FA8E8;
    color:white;
    padding:20px;
}

header h1{
    text-align:center;
}

.container{
    width:1100px;
    margin:30px auto;
}

.notice{
    background:#fff8d6;
    border-left:5px solid orange;
    padding:15px;
    border-radius:8px;
    margin-bottom:25px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.search{
    display:flex;
    gap:10px;
}

.search input{
    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    border:none;
    background:#5FA8E8;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#4b97d9;
}

.post-list{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.post{
    display:flex;
    align-items:center;
    padding:15px 20px;
    border-bottom:1px solid #eee;
}

.post.header{
    background:#eef4fb;
    font-weight:bold;
}

.post:not(.header){
    cursor:pointer;
}

.post:not(.header):hover{
    background:#f7fbff;
}

.number{
    width:80px;
}

.title{
    flex:1;
}

.date{
    width:150px;
    text-align:center;
    color:#666;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.empty{
    padding:40px;
    text-align:center;
    color:#888;
}

</style>

</head>

<body>

<header>

<h1>IASA 게시판</h1>

</header>

<div class="container">

<div class="notice">

학생 누구나 자유롭게 글을 작성할 수 있습니다.<br>
부적절한 게시글은 관리자가 삭제할 수 있습니다.

</div>

<div class="top">

<div class="search">

<input type="text" id="keyword" placeholder="검색어">

<button onclick="searchPost()">검색</button>

</div>

<button onclick="location.href='write.html'">

+ 글 작성

</button>

</div>

<div class="post-list">

<div class="post header">

<div class="number">번호</div>

<div class="title">제목</div>

<div class="date">작성일</div>

</div>

<div id="posts"></div>

</div>

</div>

<script>

async function loadPosts(){

    try{

        const response=await fetch("/api/posts");

        const list=await response.json();

        const posts=document.getElementById("posts");

        posts.innerHTML="";

        if(list.length===0){

            posts.innerHTML=`
            <div class="empty">
                아직 작성된 글이 없습니다.
            </div>
            `;

            return;

        }

        list.forEach(post=>{

            const date=new Date(post.created_at);

            const y=date.getFullYear();

            const m=String(date.getMonth()+1).padStart(2,"0");

            const d=String(date.getDate()).padStart(2,"0");

            posts.innerHTML+=`

            <div class="post" onclick="openPost(${post.id})">

                <div class="number">${post.id}</div>

                <div class="title">${post.title}</div>

                <div class="date">${y}-${m}-${d}</div>

            </div>

            `;

        });

    }

    catch(err){

        console.error(err);

        alert("게시글을 불러올 수 없습니다.");

    }

}

function openPost(id){

    location.href="post.html?id="+id;

}

function searchPost(){

    const keyword=document.getElementById("keyword").value.trim();

    if(keyword===""){

        loadPosts();

        return;

    }

    const posts=document.querySelectorAll(".post:not(.header)");

    posts.forEach(post=>{

        const title=post.querySelector(".title").innerText;

        if(title.includes(keyword))

            post.style.display="flex";

        else

            post.style.display="none";

    });

}

loadPosts();

</script>

</body>
</html>
