<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    >

    <title>로그인 - IASA 게시판</title>


    <style>

        /* ==================================================
           기본 설정
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family: "Pretendard", sans-serif;
        }

        body {
            min-height: 100vh;

            background: #f4f7fb;

            color: #20252b;
        }

        button,
        input {
            font-family: inherit;
        }


        /* ==================================================
           헤더
        ================================================== */

        header {
            height: 68px;

            display: flex;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #579fe0,
                    #67b2e8
                );

            color: white;

            box-shadow:
                0 2px 10px rgba(48, 102, 150, 0.15);
        }

        header h1 a {
            color: white;
            text-decoration: none;
        }

        .header-inner {
            width: 92%;
            max-width: 1100px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 23px;
            font-weight: 750;

            letter-spacing: -0.7px;
        }

        .header-subtitle {
            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.75);

            font-weight: 500;

            letter-spacing: 0.5px;
        }


        /* ==================================================
           로그인 영역
        ================================================== */

        .container {
            width: 92%;
            max-width: 420px;

            margin: 65px auto 50px;
        }


        /* ==================================================
           페이지 제목
        ================================================== */

        .page-header {
            text-align: center;

            margin-bottom: 18px;
        }

        .page-label {
            display: inline-flex;

            align-items: center;
            gap: 6px;

            margin-bottom: 8px;

            color: #4d99d5;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.7px;
        }

        .page-label::before {
            content: "";

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #5fa8e8;
        }

        .page-header h2 {
            color: #252a30;

            font-size: 24px;
            font-weight: 750;

            letter-spacing: -0.7px;
        }

        .page-header p {
            margin-top: 7px;

            color: #8a929c;

            font-size: 13px;

            line-height: 1.5;
        }


        /* ==================================================
           로그인 카드
        ================================================== */

        .login-box {
            background: white;

            border: 1px solid #e5e9ee;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 4px 18px
                rgba(38, 67, 92, 0.06);
        }


        /* ==================================================
           입력 영역
        ================================================== */

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #39414a;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: -0.2px;
        }

        input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border: 1px solid #dfe4e9;
            border-radius: 8px;

            background: #fcfdff;

            color: #252a30;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        input::placeholder {
            color: #aeb5bd;
        }

        input:hover {
            border-color: #c9d5df;
        }

        input:focus {
            border-color: #5fa8e8;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(95, 168, 232, 0.11);
        }


        /* ==================================================
           로그인 버튼
        ================================================== */

        .login-button {
            width: 100%;
            height: 44px;

            margin-top: 5px;

            border: 1px solid #5fa8e8;
            border-radius: 7px;

            background:
                linear-gradient(
                    135deg,
                    #5fa8e8,
                    #69b0e6
                );

            color: white;

            font-size: 13px;
            font-weight: 650;

            cursor: pointer;

            box-shadow:
                0 3px 8px
                rgba(76, 147, 205, 0.18);

            transition:
                background 0.2s,
                box-shadow 0.2s,
                transform 0.1s;
        }

        .login-button:hover {
            background:
                linear-gradient(
                    135deg,
                    #4f99da,
                    #5da7df
                );

            box-shadow:
                0 4px 11px
                rgba(76, 147, 205, 0.25);
        }

        .login-button:active {
            transform: translateY(1px);
        }


        /* ==================================================
           하단 안내
        ================================================== */

        .login-footer {
            margin-top: 18px;

            text-align: center;

            color: #a0a7af;

            font-size: 11px;

            line-height: 1.6;
        }

        /* ==================================================
   회원가입 안내
================================================== */

.signup-link {
    margin-top: 16px;

    text-align: center;

    font-size: 12px;

    color: #8a929c;
}

.signup-link a {
    margin-left: 5px;

    color: #4d99d5;

    text-decoration: none;

    font-weight: 650;

    transition: color 0.2s;
}

.signup-link a:hover {
    color: #367fbd;

    text-decoration: underline;
}


        /* ==================================================
           모바일
        ================================================== */

        @media (max-width: 600px) {

            body {
                overflow-x: hidden;
            }


            /* 헤더 */

            header {
                height: 58px;
            }

            .header-inner {
                width: 94%;
            }

            header h1 {
                font-size: 19px;
            }

            .header-subtitle {
                display: none;
            }


            /* 로그인 영역 */

            .container {
                width: 94%;

                margin: 42px auto 35px;
            }


            /* 제목 */

            .page-header {
                margin-bottom: 14px;
            }

            .page-label {
                font-size: 10px;

                margin-bottom: 6px;
            }

            .page-header h2 {
                font-size: 21px;
            }

            .page-header p {
                margin-top: 5px;

                font-size: 12px;
            }


            /* 카드 */

            .login-box {
                padding: 20px 18px;

                border-radius: 10px;
            }


            /* 입력 */

            .form-group {
                margin-bottom: 17px;
            }

            label {
                margin-bottom: 7px;

                font-size: 13px;
            }

            input {
                height: 44px;

                padding: 0 11px;

                font-size: 14px;
            }


            /* 버튼 */

            .login-button {
                height: 44px;

                margin-top: 3px;

                font-size: 13px;
            }


            /* 하단 */

            .login-footer {
                margin-top: 15px;

                font-size: 10px;
            }

        }


        /* ==================================================
           매우 작은 화면
        ================================================== */

        @media (max-width: 380px) {

            .container {
                margin-top: 35px;
            }

            .login-box {
                padding: 18px 15px;
            }

            .page-header h2 {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         헤더
    ================================================== -->

    <header>

        <div class="header-inner">

            <h1>
                <a href="/">IASA 게시판</a>
            </h1>

            <span class="header-subtitle">
                COMMUNITY
            </span>

        </div>

    </header>


    <!-- ==================================================
         메인
    ================================================== -->

    <main class="container">


        <!-- 페이지 제목 -->

        <div class="page-header">

            <div class="page-label">
                ACCOUNT
            </div>

            <h2>
                로그인
            </h2>

            <p>
                IASA 게시판에 로그인하세요.
            </p>

        </div>


        <!-- ==================================================
             로그인 카드
        ================================================== -->

        <section class="login-box">


            <!-- 아이디 -->

            <div class="form-group">

                <label for="username">
                    아이디
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    placeholder="아이디를 입력하세요"
                >

            </div>


            <!-- 비밀번호 -->

            <div class="form-group">

                <label for="password">
                    비밀번호
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="비밀번호를 입력하세요"
                >

            </div>


            <!-- 로그인 버튼 -->

            <button
                type="button"
                class="login-button"
                onclick="login()"
            >
                로그인
            </button>

            <div class="signup-link">

    계정이 없으신가요?

    <a href="signup.html">
        회원가입
    </a>

</div>


        </section>


        <!-- 안내 -->

        <div class="login-footer">
            IASA 게시판 계정으로 로그인할 수 있습니다.
        </div>

    </main>


    <!-- ==================================================
         JavaScript
    ================================================== -->

    <script>

        /* ==================================================
           로그인
        ================================================== */

        async function login() {

            /* 입력값 가져오기 */

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            /* 입력값 검사 */

            if (
                username === "" ||
                password === ""
            ) {

                alert(
                    "아이디와 비밀번호를 입력하세요."
                );

                return;

            }


            try {

                /* 로그인 요청 */

                const response =
                    await fetch(
                        "/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                const result =
                    await response.json();


                /* 로그인 성공 */

                if (result.success) {

                    location.href =
                        "index.html";

                    return;

                }


                /* 로그인 실패 */

                alert(
                    result.message ||
                    "로그인에 실패했습니다."
                );

            }

            catch (error) {

                console.error(
                    "로그인 오류:",
                    error
                );

                alert(
                    "서버와 연결할 수 없습니다."
                );

            }

        }


        /* ==================================================
           아이디 입력창 Enter
        ================================================== */

        document
            .getElementById("username")
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        document
                            .getElementById("password")
                            .focus();

                    }

                }
            );


        /* ==================================================
           비밀번호 입력창 Enter
        ================================================== */

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        login();

                    }

                }
            );

    </script>

</body>

</html>
