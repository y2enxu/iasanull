<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<title>게시글 - IASA 게시판</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard",sans-serif;
}

body{
    background:#f5f7fb;
}

header{
    background:#5FA8E8;
    color:white;
    padding:20px;
}

header h1{
    text-align:center;
}

.container{
    width:900px;
    margin:30px auto;
}

.post-box{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    padding:30px;
}

#title{
    font-size:28px;
    margin-bottom:15px;
}

.info{
    color:#666;
    border-bottom:1px solid #ddd;
    padding-bottom:15px;
    margin-bottom:25px;
}

#content{
    white-space:pre-wrap;
    line-height:1.8;
    min-height:300px;
}

.bottom{
    margin-top:30px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

button{
    border:none;
    background:#5FA8E8;
    color:white;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#4b97d9;
}

</style>

</head>

<body>

<header>

<h1>IASA 게시판</h1>

</header>

<div class="container">

<div class="post-box">

<h2 id="title">불러오는 중...</h2>

<div class="info">
작성일 :
<span id="date"></span>
</div>

<div id="content"></div>

<div class="bottom">

<button onclick="history.back()">
목록으로
</button>

</div>

</div>

</div>

<script>

const params=new URLSearchParams(location.search);

const id=params.get("id");

async function loadPost(){

    try{

        const res=await fetch("/api/posts/"+id);

        if(!res.ok){

            document.getElementById("title").innerText="존재하지 않는 게시글";

            return;

        }

        const post=await res.json();

        document.getElementById("title").innerText=post.title;

        const date=new Date(post.created_at);

        document.getElementById("date").innerText=
        date.getFullYear()+"-"+
        String(date.getMonth()+1).padStart(2,"0")+"-"+
        String(date.getDate()).padStart(2,"0");

        document.getElementById("content").innerText=post.content;

    }

    catch(err){

        console.error(err);

        alert("게시글을 불러올 수 없습니다.");

    }

}

loadPost();

</script>

</body>
</html>
